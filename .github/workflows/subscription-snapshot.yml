name: subscription_snapshot
on:
  push:
    paths: ['src/**', 'tests/**', 'examples/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml', 'testbed/subgraphs/**', 'testbed/scripts/router-harness.mjs', 'testbed/scripts/compose.mjs', 'testbed/package-lock.json', '.github/workflows/subscription-snapshot.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml', 'testbed/subgraphs/**', 'testbed/scripts/router-harness.mjs', 'testbed/scripts/compose.mjs', 'testbed/package-lock.json', '.github/workflows/subscription-snapshot.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: testbed/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: testbed
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same lints as the Apollo Router repository (xtask lint).
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --all-targets --no-deps -- -D warnings
      - run: cargo doc --release --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Plugin unit tests (no license needed).
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      # The apollo-plugin profile configuration, validated by the binary with the plugin.
      - run: ./target/release/router config validate examples/router/router-plugin.yaml
      - run: ./target/release/router config validate examples/router/router-plugin-callback.yaml
      # The custom Router example, against the plugin in this checkout. Same lockfile and
      # target directory as the plugin, so it reuses the build above.
      - run: cp Cargo.lock examples/custom-router/
      - run: cargo build --release --manifest-path examples/custom-router/Cargo.toml
        env:
          CARGO_TARGET_DIR: target
      - run: ./target/release/router config validate examples/custom-router/router.yaml
      # The plugin in the Router pipeline (TestHarness), against the Node subgraphs.
      - run: npm run test:router-harness
        working-directory: testbed
