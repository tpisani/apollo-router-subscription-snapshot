[package]
name = "apollo-router-subscription-snapshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
description = "Apollo Router with the subscription_snapshot plugin: the latest state of a deduplicated subscription for late joiners"

[lib]
name = "subscription_snapshot"

[[bin]]
name = "router"
path = "src/main.rs"

[dependencies]
apollo-router = "=2.18.0"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
http = "1"
parking_lot = "0.12"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
serde_json_bytes = "0.2"
tower-test = "0.4"

[profile.release]
debug = false
