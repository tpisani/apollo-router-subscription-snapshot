services:
  subgraphs:
    build: .
    environment:
      DB_PATH: /data/orders.sqlite
    volumes:
      - orders-data:/data
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
  gateway:
    build: .
    environment:
      ORDERS_URL: http://subgraphs:4001/graphql
      CATALOG_URL: http://subgraphs:4002/graphql
      SUPERGRAPH_PATH: /tmp/supergraph.graphql
    command: ["sh", "-c", "node scripts/compose.mjs /tmp/supergraph.graphql && exec node_modules/.bin/hive-gateway supergraph /tmp/supergraph.graphql -c gateway/gateway.config.mjs --host 0.0.0.0"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      subgraphs:
        condition: service_healthy
volumes:
  orders-data:
