services:
  subgraphs:
    build: .
    environment:
      DATA_DIR: /data
      # Simula a partida m1 (lances e gols); remova para usar só as mutations.
      SIMULATE: m1
    volumes:
      - match-data:/data
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4003:4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Hive Gateway (MIT): roda sem licença. graphql-ws/SSE para clientes.
  gateway:
    build: .
    environment:
      SCORES_URL: http://subgraphs:4001/graphql
      CATALOG_URL: http://subgraphs:4002/graphql
      STATS_URL: http://subgraphs:4003/graphql
      SUPERGRAPH_PATH: /tmp/supergraph.graphql
    command: ["sh", "-c", "node scripts/compose.mjs /tmp/supergraph.graphql && exec node_modules/.bin/hive-gateway supergraph /tmp/supergraph.graphql -c gateway/gateway.config.mjs --host 0.0.0.0"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      subgraphs:
        condition: service_healthy

  # Emula a deduplicação de subscriptions e (no pior caso) o cache de queries do
  # Router, em multipart. Ver scripts/edge.mjs.
  edge:
    build: .
    environment:
      UPSTREAM_URL: http://gateway:4000/graphql
      EDGE_PORT: 4010
    command: ["node", "scripts/edge.mjs"]
    ports:
      - "127.0.0.1:4010:4010"
    depends_on:
      - gateway

  # Perfil apollo: o Apollo Router de verdade (exige APOLLO_KEY/APOLLO_GRAPH_REF
  # com licença para subscriptions federadas e response cache).
  #   docker compose --profile apollo up --build -d
  supergraph:
    profiles: [apollo]
    build: .
    environment:
      SCORES_URL: http://subgraphs:4001/graphql
      CATALOG_URL: http://subgraphs:4002/graphql
      STATS_URL: http://subgraphs:4003/graphql
    command: ["node", "scripts/compose.mjs", "/supergraph/supergraph.graphql"]
    volumes:
      - supergraph:/supergraph
  redis:
    profiles: [apollo]
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  router:
    profiles: [apollo]
    image: ${ROUTER_IMAGE:-ghcr.io/apollographql/router:v2.10.0}
    command: ["--config", "/dist/config/router.yaml", "--supergraph", "/supergraph/supergraph.graphql"]
    environment:
      APOLLO_KEY: ${APOLLO_KEY:-}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF:-}
    volumes:
      - ./router:/dist/config:ro
      - supergraph:/supergraph:ro
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      supergraph:
        condition: service_completed_successfully
      subgraphs:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  match-data:
  supergraph:
