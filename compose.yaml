services:
  subgraphs:
    build: .
    environment:
      DB_PATH: /data/orders.sqlite
      SNAPSHOT_TTL_MS: 120000
    volumes:
      - orders-data:/data
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  router:
    image: ${ROUTER_IMAGE:-ghcr.io/apollographql/router:v2.10.0}
    command: ["--config", "/dist/config/router.yaml", "--supergraph", "/dist/config/supergraph.graphql"]
    environment:
      APOLLO_KEY: ${APOLLO_KEY:?Preencha APOLLO_KEY no .env}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF:?Preencha APOLLO_GRAPH_REF no .env}
      APOLLO_ROUTER_SUPERGRAPH_PATH: /dist/config/supergraph.graphql
    volumes:
      - ./router:/dist/config:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      subgraphs:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  orders-data:
