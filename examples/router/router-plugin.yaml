# Custom Router (the crate at the repository root) with the globo.subscription_snapshot plugin.
# Requires APOLLO_KEY/APOLLO_GRAPH_REF with federated subscriptions (included in
# the GraphOS free plan). No response cache, so it relies on subscriptions only.
#   RETAIN_ENABLED=false turns retention off (comparison instance).
#   ROUTER_LISTEN / ROUTER_HEALTH_LISTEN: several instances on the same host
#   (scripts/router-real.mjs).
supergraph:
  listen: ${env.ROUTER_LISTEN:-0.0.0.0:4100}
  path: /graphql
subscription:
  enabled: true
  deduplication:
    # Since 2.15, per subgraph or for all of them (all).
    all:
      enabled: true
  mode:
    passthrough:
      subgraphs:
        scores:
          path: /graphql
          protocol: graphql_ws
          heartbeat_interval: 5s
        stats:
          path: /graphql
          protocol: graphql_ws
          heartbeat_interval: 5s
# The identity reaches the subgraph, so deduplication also splits by token.
headers:
  all:
    request:
      # Since 2.18, the rules live under operations.
      operations:
        - propagate:
            named: authorization
plugins:
  globo.subscription_snapshot:
    enabled: ${env.RETAIN_ENABLED:-true}
    # The same identity deduplication uses: different tokens never share a
    # retained frame.

    identity_headers: [authorization]
include_subgraph_errors:
  all: true
health_check:
  listen: ${env.ROUTER_HEALTH_LISTEN:-0.0.0.0:8088}
  enabled: true
