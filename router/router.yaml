# Apollo Router 2.18 (exige licença GraphOS para subscriptions federadas e
# response cache). Validado com `router config validate` da 2.18.0.
supergraph:
  listen: 0.0.0.0:4100
  path: /graphql
subscription:
  enabled: true
  # Padrão do Router, explícito aqui: scoreboardUpdates(matchId) e
  # statsUpdates(matchId) não têm estado por cliente, então um upstream por
  # canal e partida atende todos os clientes.
  deduplication:
    # Desde a 2.15, por subgraph ou para todos (all).
    all:
      enabled: true
  mode:
    passthrough:
      subgraphs:
        scores:
          path: /graphql
          protocol: graphql_ws
          heartbeat_interval: 5s
        stats:
          path: /graphql
          protocol: graphql_ws
          heartbeat_interval: 5s
response_cache:
  enabled: true
  subgraph:
    all:
      enabled: true
      # Fallback. Os subgraphs sempre enviam Cache-Control; o max-age de cada
      # resposta decide (2 s placar e 5 s estatísticas na chave minVersion 0,
      # 60 s com minVersion, 1 h para times e elencos, no-store em mutations e erros).
      ttl: 60s
      redis:
        urls: [redis://redis:6379]
# Necessário para o cliente receber NOT_YET / BAD_USER_INPUT. Em produção,
# exponha só os códigos previstos.
include_subgraph_errors:
  all: true
