services:
  subgraphs:
    build: .
    environment:
      DATA_DIR: /data
      # Simulates match m1 (plays and goals); remove it to use the mutations only.
      SIMULATE: m1
      # Periodic frame; a larger value makes the retention effect more visible.
      SCOREBOARD_PERIODIC_MS: ${SCOREBOARD_PERIODIC_MS:-1000}
      STATS_PERIODIC_MS: ${STATS_PERIODIC_MS:-1000}
    volumes:
      - match-data:/data
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4003:4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Hive Gateway (MIT): runs without a license. graphql-ws/SSE for clients.
  gateway:
    build: .
    environment:
      SCORES_URL: http://subgraphs:4001/graphql
      CATALOG_URL: http://subgraphs:4002/graphql
      STATS_URL: http://subgraphs:4003/graphql
      SUPERGRAPH_PATH: /tmp/supergraph.graphql
    command: ["sh", "-c", "node scripts/compose.mjs /tmp/supergraph.graphql && exec node_modules/.bin/hive-gateway supergraph /tmp/supergraph.graphql -c gateway/gateway.config.mjs --host 0.0.0.0"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      subgraphs:
        condition: service_healthy

  # Emulates the Router's subscription deduplication and (in the worst case) its
  # query cache, over multipart. See emulator/edge.mjs.
  edge:
    build: .
    environment:
      UPSTREAM_URL: http://gateway:4000/graphql
      EDGE_PORT: 4010
    command: ["node", "emulator/edge.mjs"]
    ports:
      - "127.0.0.1:4010:4010"
    depends_on:
      - gateway

  # apollo profile: the real Apollo Router (requires APOLLO_KEY/APOLLO_GRAPH_REF
  # with a license for federated subscriptions and response cache).
  #   docker compose --profile apollo up --build -d
  supergraph:
    profiles: [apollo, apollo-plugin]
    build: .
    environment:
      SCORES_URL: http://subgraphs:4001/graphql
      CATALOG_URL: http://subgraphs:4002/graphql
      STATS_URL: http://subgraphs:4003/graphql
    command: ["node", "scripts/compose.mjs", "/supergraph/supergraph.graphql"]
    volumes:
      - supergraph:/supergraph
  redis:
    profiles: [apollo]
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  router:
    profiles: [apollo]
    image: ${ROUTER_IMAGE:-ghcr.io/apollographql/router:v2.18.0}
    command: ["--config", "/dist/config/router.yaml", "--supergraph", "/supergraph/supergraph.graphql"]
    environment:
      APOLLO_KEY: ${APOLLO_KEY:-}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF:-}
    volumes:
      - ./router:/dist/config:ro
      - supergraph:/supergraph:ro
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      supergraph:
        condition: service_completed_successfully
      subgraphs:
        condition: service_healthy
      redis:
        condition: service_healthy

  # apollo-plugin profile: the custom Router from the repository root (apollo-router
  # 2.18.0 + subscription_snapshot), as 3 instances behind a balancer without
  # affinity, plus a fourth one with retention off for comparison. Requires
  # APOLLO_KEY/APOLLO_GRAPH_REF (federated subscriptions are in the free plan).

  #   docker compose --profile apollo-plugin up --build -d
  #   npm run test:router-scale
  router-a: &plugin-router
    profiles: [apollo-plugin]
    build: ..
    image: apollo-router-subscription-snapshot:local
    command: ["--config", "/dist/config/router-plugin.yaml", "--supergraph", "/supergraph/supergraph.graphql"]
    environment:
      APOLLO_KEY: ${APOLLO_KEY:-}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF:-}
      RETAIN_ENABLED: "true"
    volumes:
      - ../examples/router:/dist/config:ro
      - supergraph:/supergraph:ro
    ports:
      - "127.0.0.1:4101:4100"
    depends_on:
      supergraph:
        condition: service_completed_successfully
      subgraphs:
        condition: service_healthy
  router-b:
    <<: *plugin-router
    ports:
      - "127.0.0.1:4102:4100"
  router-c:
    <<: *plugin-router
    ports:
      - "127.0.0.1:4103:4100"
  router-plain:
    <<: *plugin-router
    environment:
      APOLLO_KEY: ${APOLLO_KEY:-}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF:-}
      RETAIN_ENABLED: "false"
    ports:
      - "127.0.0.1:4104:4100"
  balancer:
    profiles: [apollo-plugin]
    build: .
    environment:
      TARGETS: http://router-a:4100,http://router-b:4100,http://router-c:4100
      LB_PORT: 4200
    command: ["node", "emulator/balancer.mjs"]
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      - router-a
      - router-b
      - router-c

volumes:
  match-data:
  supergraph:
