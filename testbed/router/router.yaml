# Apollo Router 2.18 (requires a GraphOS license for federated subscriptions and
# response cache). Validated with 2.18.0's `router config validate`.
supergraph:
  listen: 0.0.0.0:4100
  path: /graphql
subscription:
  enabled: true
  # The Router's default, made explicit here: scoreboardUpdates(matchId) and
  # statsUpdates(matchId) have no per-client state, so one upstream per
  # channel and match serves every client.
  deduplication:
    # Since 2.15, per subgraph or for all of them (all).
    all:
      enabled: true
  mode:
    passthrough:
      subgraphs:
        scores:
          path: /graphql
          protocol: graphql_ws
          heartbeat_interval: 5s
        stats:
          path: /graphql
          protocol: graphql_ws
          heartbeat_interval: 5s
response_cache:
  enabled: true
  subgraph:
    all:
      enabled: true
      # Fallback. The subgraphs always send Cache-Control; each response's max-age
      # decides (2 s for the scoreboard and 5 s for stats on the minVersion 0 key,
      # 60 s with minVersion, 1 h for teams and squads, no-store on mutations and errors).
      ttl: 60s
      redis:
        urls: [redis://redis:6379]
# Needed for the client to get NOT_YET / BAD_USER_INPUT. In production,
# expose only the expected codes.

include_subgraph_errors:
  all: true
